name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (synthetic, no real data needed)
        env:
          OMP_NUM_THREADS: "1"
          PYTENSOR_FLAGS: "cxx="
        run: uv run pytest -q
      - name: README numbers match results
        run: uv run python -m elasticity.report --check
